name: plotcalc
description: "Offline land measurement — draw, calculate, convert across 12 area units."
publish_to: "none"

version: 2.0.0+9

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # Localization
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.9

  # State management
  flutter_bloc: ^9.1.1
  bloc: ^9.2.0
  equatable: ^2.0.8

  # Dependency injection
  get_it: ^9.2.1

  # Routing
  go_router: ^17.2.3

  # Storage
  shared_preferences: ^2.5.5

  # Utilities
  google_fonts: ^8.1.0
  vector_math: ^2.2.0
  intl: ^0.20.2
  uuid: ^4.5.3
  injectable: ^3.0.0
  sqflite: ^2.4.2+1
  dartz: ^0.10.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
