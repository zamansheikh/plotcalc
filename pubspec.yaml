name: plotcalc
description: "Offline land measurement — draw, calculate, convert across 10 area units."
publish_to: "none"

version: 2.1.0+17

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # Localization
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^2.0.0

  # State management
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1
  equatable: ^3.0.0

  # Dependency injection
  get_it: ^9.3.0

  # Routing
  go_router: ^18.1.1

  # Storage
  shared_preferences: ^2.5.6

  # Utilities
  google_fonts: ^9.0.0
  vector_math: ^2.4.4
  intl: ^0.20.3
  uuid: ^4.6.0
  injectable: ^3.0.0
  sqflite: ^2.4.5
  dartz: ^0.10.1
  url_launcher: ^6.3.3
  share_plus: ^13.3.1
  pdf: ^3.13.1
  printing: ^5.15.1
  path_provider: ^2.1.6
  package_info_plus: ^10.2.2
  bangla_pdf: ^1.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    # Bengali land-record reference content, shared with the docs/ site.
    - docs/land_info.json
    # Khatiyan / mouza-map scans referenced by that content.
    - assets/images/
    # Bundled so a PDF exported offline still renders: a PDF carries its own
    # fonts and has no system fallback the way the on-screen UI does. The
    # built-in Helvetica is ASCII-only, so even an em dash goes missing.
    # Noto Sans, OFL-1.1. Bengali is not here — bangla_pdf shapes it and
    # carries its own face.
    - assets/fonts/NotoSans-Regular.ttf
    - assets/fonts/NotoSans-Bold.ttf
