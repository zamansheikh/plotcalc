name: plotcalc
description: "A new Flutter project."
publish_to: "none" # Remove this line if you wish to publish to pub.dev
version: 1.0.5+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # Dependency Injection
  get_it: ^9.2.0
  injectable: ^2.7.1+4

  # Routing
  go_router: ^17.0.1

  # Local Storage
  sqflite: ^2.4.2
  path: ^1.9.1
  shared_preferences: ^2.5.4

  # Functional Programming
  dartz: ^0.10.1

  # Code Generation
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # UI/UX
  flutter_svg: ^2.2.3
  lottie: ^3.3.2

  # Utils
  intl: ^0.20.2
  path_provider: ^2.1.5
  url_launcher: ^6.3.2
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.10.4
  injectable_generator: ^2.12.0

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  assets:
    - assets/icon/icon.png
    - docs/land_info.json
    - assets/images/

