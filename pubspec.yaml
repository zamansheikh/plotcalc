name: plotcalc
description: "Offline land measurement — draw, calculate, convert across 10 area units."
publish_to: "none"

version: 2.1.0+14

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # Localization
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.9

  # State management
  flutter_bloc: ^9.1.1
  bloc: ^9.2.0
  equatable: ^2.0.8

  # Dependency injection
  get_it: ^9.2.1

  # Routing
  go_router: ^18.0.0

  # Storage
  shared_preferences: ^2.5.5

  # Utilities
  google_fonts: ^8.1.0
  vector_math: ^2.2.0
  intl: ^0.20.2
  uuid: ^4.5.3
  injectable: ^3.0.0
  sqflite: ^2.4.2+1
  dartz: ^0.10.1
  url_launcher: ^6.3.2
  share_plus: ^13.3.0
  pdf: ^3.13.0
  printing: ^5.15.0
  path_provider: ^2.1.6
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    # Bengali land-record reference content, shared with the docs/ site.
    - docs/land_info.json
    # Khatiyan / mouza-map scans referenced by that content.
    - assets/images/
    # Bundled so a PDF exported offline still renders: a PDF carries its own
    # fonts and has no system fallback the way the on-screen UI does. The
    # built-in Helvetica is ASCII-only, so even an em dash goes missing.
    # Noto Sans, OFL-1.1.
    - assets/fonts/NotoSans-Regular.ttf
    - assets/fonts/NotoSans-Bold.ttf
    - assets/fonts/NotoSansBengali-Regular.ttf
