name: plotcalc
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  
  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  
  # Dependency Injection
  get_it: ^8.3.0
  injectable: ^2.5.2
  
  # Routing
  go_router: ^16.3.0
  
  # Local Storage
  sqflite: ^2.4.2
  path: ^1.8.3
  
  # Functional Programming
  dartz: ^0.10.1
  
  # Code Generation
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  
  # UI/UX
  flutter_svg: ^2.2.1
  lottie: ^3.3.2
  
  # Utils
  intl: ^0.20.2
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  
  # Code Generation
  build_runner: ^2.10.1
  injectable_generator: ^2.9.0

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

